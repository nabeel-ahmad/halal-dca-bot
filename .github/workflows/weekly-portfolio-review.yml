# Runs every Sunday. Trigger manually any time via the "Run workflow" button.
#
# Cron is UTC and ignores DST: "0 5 * * 0" = Sunday 05:00 UTC, which is
# Sunday 10:00 in Pakistan Standard Time (UTC+5, no DST) — this machine's
# local timezone. Adjust the cron line if that's ever wrong.
#
# Self-hosted runner: Binance blocks GitHub-hosted-runner IPs with HTTP 451.
# The runner must be online (Mac powered on, runner service running) at
# trigger time — keep the Mac awake Sunday mornings if this starts silently
# skipping.
#
# Read-only — never places orders. Needs these repo secrets:
# BINANCE_API_KEY, BINANCE_API_SECRET, SMTP_HOST, SMTP_USER, SMTP_PASSWORD,
# EMAIL_TO. HALAL_TERMINAL_API_KEY is optional — leave it unset and that
# compliance source is just skipped.
#
# weekly-portfolio-review-retry.yml auto re-runs this (up to 2 attempts) if
# it fails due to an infra issue like the self-hosted runner dropping.

name: Weekly Portfolio Review

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the digest but don't send the email"
        type: boolean
        default: false

jobs:
  review:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: /Users/hk-nabeel/.venvs/halal-dca-bot/bin/pip install --quiet -r requirements.txt

      - name: Run weekly portfolio review
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          HALAL_TERMINAL_API_KEY: ${{ secrets.HALAL_TERMINAL_API_KEY }}
          CONCENTRATION_WARN_PCT: "30"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: /Users/hk-nabeel/.venvs/halal-dca-bot/bin/python weekly_portfolio_review.py

      - name: Upload digest preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest_preview.html
