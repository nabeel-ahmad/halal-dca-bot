# Runs the bot on the 1st of every month at 09:00 UTC. Trigger manually any
# time via the "Run workflow" button too.
#
# Runs on a self-hosted runner (your own Mac) rather than GitHub-hosted
# runners — Binance blocks requests from GitHub/AWS/Azure datacenter IP
# ranges with HTTP 451. The runner must be online (Mac powered on, runner
# service running) at trigger time to pick up the scheduled run.
#
# Before enabling live trading, add these as repo secrets under
# Settings > Secrets and variables > Actions:
#   BINANCE_API_KEY, BINANCE_API_SECRET, SMTP_HOST, SMTP_USER, SMTP_PASSWORD,
#   EMAIL_TO, IMAP_HOST
# Keep DRY_RUN=true until you've verified several cycles end-to-end.

name: Halal DCA Bot

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      # Self-hosted runner: use the Mac's own Python rather than
      # actions/setup-python, which assumes GitHub-hosted runners' fixed
      # /Users/runner toolcache path.
      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Run halal DCA bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          DRY_RUN: "true"           # flip to "false" only once you trust it
          MAX_ORDER_USD: "200"
          MAX_TOTAL_USD_PER_RUN: "1000"
          MONTHLY_CONTRIBUTION_USD: "500"
        run: python3 halal_dca_bot.py
