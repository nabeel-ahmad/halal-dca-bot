# Throwaway diagnostic — checks what /sapi/v1/equity/market/quote actually
# returns for a given ticker. Delete after use.

name: Debug Quote

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to check"
        required: true

jobs:
  debug:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Query quote endpoint
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TICKER: ${{ inputs.ticker }}
        run: |
          /Users/hk-nabeel/.venvs/halal-dca-bot/bin/python3 -c "
          import os
          from binance_equity import _fetch_quote
          ticker = os.environ['TICKER']
          try:
              print(_fetch_quote(ticker))
          except Exception as e:
              print('ERROR:', repr(e))
          "

      - name: Probe for a symbols/instruments listing endpoint
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          /Users/hk-nabeel/.venvs/halal-dca-bot/bin/python3 -c "
          import os, requests
          key = os.environ['BINANCE_API_KEY']
          paths = [
              '/sapi/v1/equity/market/symbols',
              '/sapi/v1/equity/market/instruments',
              '/sapi/v1/equity/market/exchangeInfo',
              '/sapi/v1/equity/instruments',
              '/sapi/v1/equity/symbols',
              '/sapi/v1/equity/trade/tradableSymbols',
              '/sapi/v1/equity/asset/list',
          ]
          for p in paths:
              try:
                  r = requests.get('https://api.binance.com' + p, headers={'X-MBX-APIKEY': key}, timeout=10)
                  print(p, '->', r.status_code, r.text[:300])
              except Exception as e:
                  print(p, '-> ERROR', repr(e))
          "
