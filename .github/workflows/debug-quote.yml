# Throwaway diagnostic — checks what /sapi/v1/equity/market/quote actually
# returns for a given ticker. Delete after use.

name: Debug Quote

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to check"
        required: true

jobs:
  debug:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Query quote endpoint
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TICKER: ${{ inputs.ticker }}
        run: |
          /Users/hk-nabeel/.venvs/halal-dca-bot/bin/python3 -c "
          import os
          from binance_equity import _fetch_quote
          ticker = os.environ['TICKER']
          try:
              print(_fetch_quote(ticker))
          except Exception as e:
              print('ERROR:', repr(e))
          "

      - name: Inspect exchangeInfo entry for the ticker
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          TICKER: ${{ inputs.ticker }}
        run: |
          /Users/hk-nabeel/.venvs/halal-dca-bot/bin/python3 -c "
          import os, json, requests
          key = os.environ['BINANCE_API_KEY']
          ticker = os.environ['TICKER']
          r = requests.get('https://api.binance.com/sapi/v1/equity/market/exchangeInfo', headers={'X-MBX-APIKEY': key}, timeout=15)
          data = r.json()
          symbols = data.get('symbols', [])
          print('total symbols:', len(symbols))
          match = next((s for s in symbols if s.get('symbol') == ticker), None)
          print(f'{ticker} entry:', json.dumps(match, indent=2) if match else 'NOT FOUND in exchangeInfo')
          from collections import Counter
          print('tradability value counts:', Counter(s.get('tradability') for s in symbols))
          print('sample AAPL entry:', json.dumps(next((s for s in symbols if s.get('symbol') == 'AAPL'), None), indent=2))
          "
